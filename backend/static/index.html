<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedMinder</title>
<style>
:root{--bg:#f5fafa;--card:#fff;--ink:#16302f;--mut:#5b7270;--line:#d5e3e2;--pri:#0e7c86;--onpri:#fff;--bad:#c62828;
--taken:#2e7d32;--skipped:#8d6e00;--missed:#c62828;--due:#00796b;--upcoming:#1565c0}
@media(prefers-color-scheme:dark){:root{--bg:#0f1b1b;--card:#172626;--ink:#e3f0ef;--mut:#9bb4b2;--line:#2a3f3e;--pri:#4fc3cd;--onpri:#06292c;--bad:#ef9a9a;
--taken:#81c784;--skipped:#ffd54f;--missed:#ef9a9a;--due:#4db6ac;--upcoming:#90caf9}}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:720px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:1.4rem;margin:0}h2{font-size:1.1rem;margin:18px 0 8px}small,.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:8px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
button{font:inherit;border:1px solid var(--pri);background:transparent;color:var(--pri);border-radius:10px;padding:8px 14px;cursor:pointer}
button.p{background:var(--pri);color:var(--onpri)}button.d{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.5}
input,textarea{font:inherit;width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
label{display:block;margin:10px 0 4px;font-weight:600}.err{color:var(--bad);font-size:.9rem}
.chip{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.8rem;font-weight:600;border:1px solid currentColor}
.t{font-size:1.25rem;font-weight:700;min-width:58px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;border:0;border-radius:0;padding:14px 4px;color:var(--mut)}nav button.on{color:var(--pri);font-weight:700}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.sel{padding:6px 12px;border-radius:20px}.sel.on{background:var(--pri);color:var(--onpri)}
.banner{background:var(--bad);color:#fff;padding:10px;border-radius:10px;margin:8px 0}

:root{--wbg:#fff4e5;--wink:#7a4a00}@media(prefers-color-scheme:dark){:root{--wbg:#3a2e12;--wink:#ffd9a0}}
.card{box-shadow:0 1px 3px rgba(0,0,0,.07)}
.hero{background:var(--pri);color:var(--onpri);border-radius:20px;padding:16px;margin-bottom:10px}
.hero small{color:inherit;opacity:.85}.hero h1{font-size:1.6rem}
.stats{display:flex;gap:8px;margin-top:12px}.stats>div{flex:1;background:rgba(255,255,255,.16);border-radius:12px;padding:8px;text-align:center}
.stats b{display:block;font-size:1.15rem}
.warn{background:var(--wbg);color:var(--wink);border:1px solid var(--wink);border-radius:12px;padding:10px;margin:8px 0;font-size:.92rem}
.av{width:42px;height:42px;border-radius:12px;color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.2rem;flex:none}
.search{margin:10px 0}
.chart{display:flex;gap:3px;align-items:flex-end;height:90px;margin:12px 0 4px}
.bc{flex:1;height:100%;display:flex;align-items:flex-end}.bc i{display:block;width:100%;border-radius:4px 4px 0 0}
.tiles{display:flex;gap:8px;margin-top:10px}.tiles>div{flex:1;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.tiles b{display:block;font-size:1.2rem}
nav button{font-size:.75rem;padding:8px 4px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const S = { view:'today', today:'', meds:[], doses:[], day:'', hist:null, histDays:7, histMed:'', error:'', form:null, busy:false, q:'', adh:null };

async function api(path, opt = {}) {
  let r;
  try {
    r = await fetch('/api' + path, { method: opt.method || 'GET',
      headers: {'Content-Type':'application/json'}, body: opt.body ? JSON.stringify(opt.body) : undefined });
  } catch { throw new Error('Cannot reach the MedMinder server. Is it running?'); }
  if (r.status === 204) return null;
  const d = await r.json().catch(() => null);
  if (!r.ok) throw Object.assign(new Error(d?.error?.message || 'Request failed (' + r.status + ')'), { fields: d?.error?.fields });
  return d;
}
const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const shift = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const nice = s => new Date(s + 'T12:00:00').toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short', year:'numeric' });
const chip = st => `<span class="chip" style="color:var(--${st})">${st[0].toUpperCase() + st.slice(1)}</span>`;

async function boot() {
  try {
    const h = await api('/health');
    S.today = h.time.slice(0, 10); S.day = S.day || S.today; S.error = '';
    S.meds = await api('/medicines');
    S.doses = await api('/doses?date=' + S.day);
    if (S.view === 'history') await loadHist();
  } catch (e) { S.error = e.message; }
  render();
}
async function loadHist() {
  const r = `from=${shift(S.today, -(S.histDays - 1))}&to=${S.today}` + (S.histMed ? '&medicine_id=' + S.histMed : '');
  [S.hist, S.adh] = await Promise.all([api('/history?' + r), api('/adherence?' + r)]);
}
async function act(fn, ok) {
  try { await fn(); S.error = ''; await boot(); if (ok) toast(ok); }
  catch (e) { alert(e.message); }
}
function toast(m) { const t = document.createElement('div'); t.className = 'banner'; t.style.cssText = 'position:fixed;top:10px;left:10px;right:10px;background:var(--pri);color:var(--onpri);z-index:9;max-width:700px;margin:auto'; t.textContent = m; document.body.append(t); setTimeout(() => t.remove(), 2200); }

function doseCard(d, actions) {
  const rec = d.recorded_at ? new Date(d.recorded_at).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }) : '';
  const done = d.status === 'taken' || d.status === 'skipped';
  return `<div class="card"><div class="row"><span class="t">${d.scheduled_at.slice(11,16)}</span>
    <div class="grow"><b>${esc(d.medicine_name)}</b><br><small>${esc(d.dosage)}${d.instructions ? ' · ' + esc(d.instructions) : ''}${rec ? ' · recorded ' + rec : ''}</small></div>${chip(d.status)}</div>
    ${actions ? `<div class="row" style="margin-top:8px">${done
      ? `<button data-a="undo" data-id="${esc(d.id)}">Undo</button>`
      : `<button class="p" data-a="taken" data-id="${esc(d.id)}">Taken</button><button data-a="skipped" data-id="${esc(d.id)}">Skip</button>`}</div>` : ''}</div>`;
}

const ring = (a, b) => { const p = b ? a / b : 0, c = 2 * Math.PI * 30;
  return `<svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="30" fill="none" stroke="currentColor" opacity=".25" stroke-width="8"/><circle cx="38" cy="38" r="30" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c * p} ${c}" transform="rotate(-90 38 38)"/><text x="38" y="43" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">${Math.round(p * 100)}%</text></svg>`; };
const greet = () => { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; };
const GROUPS = [['🌅 Morning', 0, 12], ['☀️ Afternoon', 12, 17], ['🌆 Evening', 17, 21], ['🌙 Night', 21, 24]];
function grouped(doses) {
  return GROUPS.map(([label, a, b]) => {
    const g = doses.filter(d => { const h = +d.scheduled_at.slice(11, 13); return h >= a && h < b; });
    return g.length ? `<h2>${label}</h2>` + g.map(d => doseCard(d, true)).join('') : '';
  }).join('');
}
function vToday() {
  const taken = S.doses.filter(d => d.status === 'taken').length, total = S.doses.length;
  const next = S.doses.find(d => d.status === 'upcoming' || d.status === 'due');
  const active = S.meds.filter(m => !m.paused).length;
  const late = S.doses.filter(d => d.status === 'missed').length;
  return `<div class="hero"><div class="row"><div class="grow"><small>${greet()}</small><h1>MedMinder</h1><div>${nice(S.day)}</div></div>${ring(taken, total)}</div>
    <div class="stats"><div><b>${active}</b><small>active</small></div><div><b>${taken}/${total}</b><small>taken</small></div><div><b>${next ? next.scheduled_at.slice(11, 16) : '—'}</b><small>next dose</small></div></div></div>
  <div class="row" style="margin:10px 0"><button data-a="day" data-n="-1">‹ Prev</button><button data-a="day" data-n="0">Today</button><button data-a="day" data-n="1">Next ›</button></div>
  ${late ? `<div class="warn">⚠ ${late} dose${late > 1 ? 's are' : ' is'} past its time. Record what actually happened (Taken or Skip). Do not take extra doses to catch up — ask your clinician or pharmacist what to do about a missed dose.</div>` : ''}
  ${S.meds.length ? (grouped(S.doses) || '<p class="mut">No doses scheduled for this day.</p>')
  : `<div class="card"><b>No medicines yet</b><p class="mut">Add your first medicine, or load demonstration data.</p>
    <button class="p" data-a="newmed">Add medicine</button> <button data-a="demo">Load demo data</button></div>`}`;
}

const hue = s => [...s].reduce((a, c) => a + c.charCodeAt(0), 0) * 7 % 360;
function medCards() {
  const q = S.q.trim().toLowerCase();
  const list = S.meds.filter(m => !q || (m.name + ' ' + m.dosage).toLowerCase().includes(q));
  return list.map(m => `<div class="card"><div class="row"><div class="av" style="background:hsl(${hue(m.name)} 55% 42%)">${esc(m.name[0].toUpperCase())}</div>
    <div class="grow"><b>${esc(m.name)}</b> ${m.paused ? '<span class="chip">Paused</span>' : ''}${m.is_demo ? ' <span class="chip">Demo</span>' : ''}<br>
    <small>${esc(m.dosage)} · ${m.days_of_week ? m.days_of_week.map(i => DAYS[i]).join(', ') : 'Every day'} · ${m.times.join(', ')}</small>
    ${m.instructions ? '<br><small>' + esc(m.instructions) + '</small>' : ''}</div></div>
    <div class="row" style="margin-top:8px"><button data-a="edit" data-id="${m.id}">Edit</button>
    <button data-a="pause" data-id="${m.id}" data-p="${m.paused ? 0 : 1}">${m.paused ? 'Resume' : 'Pause'}</button>
    <button class="d" data-a="del" data-id="${m.id}">Delete</button></div></div>`).join('')
    || `<p class="mut">${S.meds.length ? 'No medicines match your search.' : 'No medicines yet. Tap Add.'}</p>`;
}
function vMeds() {
  return `<div class="row"><h1 class="grow">Medicines</h1><button class="p" data-a="newmed">+ Add</button></div>
  <input id="q" class="search" placeholder="Search medicines…" value="${esc(S.q)}"><div id="medlist">${medCards()}</div>`;
}

const MED_NAMES = [
  ['Paracetamol','Pain / fever'],['Crocin','Pain / fever'],['Dolo','Pain / fever'],['Ibuprofen','Pain / inflammation'],['Aspirin','Pain / blood thinner'],
  ['Diclofenac','Pain / inflammation'],['Naproxen','Pain / inflammation'],
  ['Cetirizine','Allergy'],['Levocetirizine','Allergy'],['Loratadine','Allergy'],['Fexofenadine','Allergy'],['Chlorpheniramine','Allergy / cold'],['Montelukast','Allergy / asthma'],
  ['Amoxicillin','Antibiotic'],['Amoxicillin-Clavulanate (Augmentin)','Antibiotic'],['Azithromycin','Antibiotic'],['Ciprofloxacin','Antibiotic'],
  ['Doxycycline','Antibiotic'],['Cefixime','Antibiotic'],['Metronidazole','Antibiotic'],['Levofloxacin','Antibiotic'],
  ['Omeprazole','Stomach acid'],['Pantoprazole','Stomach acid'],['Esomeprazole','Stomach acid'],['Rabeprazole','Stomach acid'],
  ['Domperidone','Nausea'],['Ondansetron','Nausea'],['Loperamide','Diarrhoea'],['ORS (oral rehydration salts)','Dehydration'],['Lactulose','Constipation'],
  ['Metformin','Diabetes'],['Glimepiride','Diabetes'],['Gliclazide','Diabetes'],['Sitagliptin','Diabetes'],['Insulin','Diabetes'],
  ['Amlodipine','Blood pressure'],['Losartan','Blood pressure'],['Telmisartan','Blood pressure'],['Atenolol','Blood pressure / heart'],
  ['Metoprolol','Blood pressure / heart'],['Ramipril','Blood pressure / heart'],['Hydrochlorothiazide','Blood pressure'],['Furosemide','Fluid / heart'],
  ['Atorvastatin','Cholesterol'],['Rosuvastatin','Cholesterol'],['Clopidogrel','Blood thinner'],
  ['Levothyroxine','Thyroid'],['Salbutamol','Asthma'],['Budesonide','Asthma'],['Prednisolone','Steroid'],
  ['Escitalopram','Mood'],['Sertraline','Mood'],['Gabapentin','Nerve pain'],
  ['Vitamin D3','Supplement'],['Vitamin B12','Supplement'],['Vitamin C','Supplement'],['Calcium','Supplement'],['Iron','Supplement'],
  ['Folic acid','Supplement'],['Multivitamin','Supplement'],['Zinc','Supplement'],['Omega-3','Supplement'],
];
const NAME_OPTIONS = MED_NAMES.map(([n, c]) => `<option value="${esc(n)}" label="${esc(c)}"></option>`).join('');
function vForm() {
  const f = S.form, e = f.errors || {};
  const er = k => e[k] ? `<div class="err">${esc(e[k])}</div>` : '';
  return `<h1>${f.id ? 'Edit' : 'Add'} medicine</h1>
  <label>Medicine name</label><input id="f_name" list="medNames" autocomplete="off" placeholder="Start typing, e.g. Paracetamol" value="${esc(f.name)}"><datalist id="medNames">${NAME_OPTIONS}</datalist><small class="mut">Suggestions are names only, not recommendations. You can type any name.</small>${er('name')}
  <label>Dosage (e.g. 1 tablet, 5 ml)</label><input id="f_dosage" value="${esc(f.dosage)}">${er('dosage')}
  <label>Instructions (optional)</label><input id="f_instructions" value="${esc(f.instructions)}" placeholder="e.g. after food">
  <label>Notes (optional)</label><textarea id="f_notes" rows="2">${esc(f.notes)}</textarea>
  <div class="row"><div class="grow"><label>Start date</label><input type="date" id="f_start" value="${f.start_date}"></div>
  <div class="grow"><label>End date (optional)</label><input type="date" id="f_end" value="${f.end_date || ''}"></div></div>${er('start_date')}${er('end_date')}
  <label>Frequency</label><div class="row"><button class="sel ${!f.days ? 'on' : ''}" data-a="fdays" data-v="all">Every day</button>
  <button class="sel ${f.days ? 'on' : ''}" data-a="fdays" data-v="sel">Selected days</button></div>
  ${f.days ? `<div class="row" style="margin-top:6px">${DAYS.map((n, i) => `<button class="sel ${f.days.includes(i) ? 'on' : ''}" data-a="fday" data-i="${i}">${n}</button>`).join('')}</div>${er('days_of_week')}` : ''}
  <label>Reminder times</label><div class="row">${f.times.map(t => `<button data-a="rmtime" data-t="${t}">${t} ✕</button>`).join('')}
  <input type="time" id="f_time" style="width:auto"><button data-a="addtime">Add time</button></div>${er('times')}
  <p class="mut"><small>Enter schedules exactly as prescribed by your clinician. MedMinder does not calculate or recommend doses.</small></p>
  <div class="row"><button class="p" data-a="save" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Saving…' : 'Save'}</button><button data-a="cancel">Cancel</button></div>`;
}

function streak(by) {
  let n = 0;
  for (let i = 0; i < 60; i++) {
    const e = by[shift(S.today, -i)];
    if (!e || e.denominator === 0) continue;
    if (e.percentage === 100) n++; else break;
  }
  return n;
}
function vHist() {
  const h = S.hist, a = h?.adherence, by = S.adh?.by_day || {};
  const list = h ? [...h.doses].reverse() : [];
  let last = '';
  const days = []; for (let i = S.histDays - 1; i >= 0; i--) days.push(shift(S.today, -i));
  const bars = days.map(d => { const e = by[d], p = e && e.percentage != null ? e.percentage : null;
    const col = p == null ? 'var(--line)' : p >= 80 ? 'var(--taken)' : p >= 50 ? 'var(--skipped)' : 'var(--missed)';
    return `<div class="bc" title="${d}: ${p == null ? 'no data' : p + '%'}"><i style="height:${p == null ? 4 : Math.max(p, 4)}%;background:${col}"></i></div>`; }).join('');
  return `<div class="row"><h1 class="grow">History</h1><button data-a="csv">⬇ Export CSV</button></div>
  <div class="row">${[7, 14, 30].map(n => `<button class="sel ${S.histDays === n ? 'on' : ''}" data-a="hdays" data-n="${n}">${n} days</button>`).join('')}</div>
  <div class="row" style="margin-top:6px"><button class="sel ${!S.histMed ? 'on' : ''}" data-a="hmed" data-id="">All</button>
  ${S.meds.map(m => `<button class="sel ${S.histMed == m.id ? 'on' : ''}" data-a="hmed" data-id="${m.id}">${esc(m.name)}</button>`).join('')}</div>
  ${a ? `<div class="card"><b style="font-size:1.3rem">${a.percentage == null ? 'No data yet' : a.percentage + '% adherence'}</b>
    <div class="chart">${bars}</div><div class="row"><small class="grow">${nice(days[0])}</small><small>${nice(days[days.length - 1])}</small></div>
    <div class="tiles"><div><b style="color:var(--taken)">${a.taken}</b><small>taken</small></div><div><b style="color:var(--skipped)">${a.skipped}</b><small>skipped</small></div>
    <div><b style="color:var(--missed)">${a.missed}</b><small>missed</small></div><div><b>🔥 ${streak(by)}</b><small>perfect days</small></div></div>
    <p><small>Adherence = taken ÷ (taken + skipped + missed). Upcoming doses are not counted. Bar colours: green ≥80%, amber ≥50%, red below.</small></p></div>` : ''}
  ${list.map(d => { const date = d.scheduled_at.slice(0, 10); const hd = date !== last ? `<h2>${nice(date)}</h2>` : ''; last = date; return hd + doseCard(d, false); }).join('')
    || '<p class="mut">No dose history yet. Doses you record will appear here.</p>'}`;
}

function vSettings() {
  const n = 'Notification' in window;
  return `<h1>Settings</h1>
  <div class="card"><b>Server</b><br><small>Connected · today is ${S.today} (server timezone)</small></div>
  <div class="card"><b>Demonstration data</b><p class="mut">Adds clearly labelled fictional medicines and a week of sample history (not prescriptions). Clearing removes only demo records.</p>
  <div class="row"><button class="p" data-a="demo">Load / reset demo data</button><button data-a="cleardemo">Clear demo data</button></div></div>
  <div class="card"><b>Browser reminders</b><p class="mut">${n ? 'Shows a notification while this page is open. Phone browsers only allow this on secure (https) addresses; reliable background reminders need an Android app.' : 'Notifications are not available in this browser.'}</p>
  ${n ? `<button data-a="notif">Enable notifications (${Notification.permission})</button>` : ''}</div>
  <div class="card"><b>Privacy &amp; limitations</b><p class="mut"><small>MedMinder stores the medicines and dose records you enter on the server it runs on (SQLite locally, or PostgreSQL if deployed). Nothing else is collected; no accounts or analytics. This demo has no login, so anyone who can reach the address can see the data. MedMinder is a reminder and record-keeping tool: it gives no medical advice, and a missed dose is never a reason to take extra medicine. Follow your clinician's instructions.</small></p></div>`;
}

function render() {
  const items = [['today', 'Today', '🏠'], ['meds', 'Medicines', '💊'], ['history', 'History', '📊'], ['settings', 'Settings', '⚙️']];
  $('#nav').innerHTML = items.map(([k, l, ic]) => `<button class="${S.view === k && !S.form ? 'on' : ''}" data-a="nav" data-v="${k}"><span style="font-size:1.3rem;display:block">${ic}</span>${l}</button>`).join('');
  let h = '';
  if (S.error) h = `<h1>MedMinder</h1><div class="banner">${esc(S.error)}</div><button class="p" data-a="retry">Retry</button>`;
  else if (S.form) h = vForm();
  else h = { today: vToday, meds: vMeds, history: vHist, settings: vSettings }[S.view]();
  $('#app').innerHTML = h;
}

function blank() { return { id: null, name: '', dosage: '', instructions: '', notes: '', start_date: S.today, end_date: '', days: null, times: [], errors: {} }; }
function readForm() {
  const f = S.form;
  ['name', 'dosage', 'instructions', 'notes'].forEach(k => f[k] = $('#f_' + k).value);
  f.start_date = $('#f_start').value; f.end_date = $('#f_end').value;
}
async function save() {
  readForm(); const f = S.form; f.errors = {};
  if (!f.name.trim()) f.errors.name = 'Name is required.';
  if (!f.dosage.trim()) f.errors.dosage = 'Dosage is required.';
  if (!f.times.length) f.errors.times = 'Add at least one reminder time.';
  if (f.days && !f.days.length) f.errors.days_of_week = 'Choose at least one day.';
  if (!f.start_date) f.errors.start_date = 'Start date is required.';
  if (f.end_date && f.end_date < f.start_date) f.errors.end_date = 'End date cannot be before the start date.';
  if (Object.keys(f.errors).length) return render();
  S.busy = true; render();
  const body = { name: f.name.trim(), dosage: f.dosage.trim(), instructions: f.instructions.trim(), notes: f.notes.trim(),
    start_date: f.start_date, end_date: f.end_date || null, days_of_week: f.days ? [...f.days].sort() : null, times: [...f.times].sort() };
  try {
    await api(f.id ? '/medicines/' + f.id : '/medicines', { method: f.id ? 'PUT' : 'POST', body });
    S.form = null; S.busy = false; await boot(); toast('Saved.');
  } catch (e) { S.busy = false; f.errors = e.fields || {}; render(); alert(e.message); } // form data is kept
}

document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, id = b.dataset.id;
  if (a === 'nav') { S.form = null; S.view = b.dataset.v; if (S.view === 'history') { try { await loadHist(); } catch (e) { S.error = e.message; } } render(); }
  else if (a === 'retry') boot();
  else if (a === 'day') { S.day = b.dataset.n === '0' ? S.today : shift(S.day, +b.dataset.n); boot(); }
  else if (a === 'taken' || a === 'skipped') { if (a === 'skipped' && !confirm('Mark this dose as skipped?')) return; act(() => api('/doses/record', { method: 'POST', body: { dose_id: id, outcome: a } })); }
  else if (a === 'undo') { if (confirm('Undo this record? The dose returns to its scheduled status.')) act(() => api('/doses/undo', { method: 'POST', body: { dose_id: id } })); }
  else if (a === 'newmed') { S.form = blank(); S.view = 'meds'; render(); }
  else if (a === 'edit') { const m = S.meds.find(x => x.id == id); S.form = { id: m.id, name: m.name, dosage: m.dosage, instructions: m.instructions, notes: m.notes, start_date: m.start_date, end_date: m.end_date, days: m.days_of_week ? [...m.days_of_week] : null, times: [...m.times], errors: {} }; render(); }
  else if (a === 'pause') act(() => api(`/medicines/${id}/${b.dataset.p == 1 ? 'pause' : 'resume'}`, { method: 'POST' }));
  else if (a === 'del') { if (confirm('Delete this medicine? Its schedule is removed but recorded history is kept.')) act(() => api('/medicines/' + id, { method: 'DELETE' }), 'Deleted.'); }
  else if (a === 'fdays') { readForm(); S.form.days = b.dataset.v === 'sel' ? (S.form.days || []) : null; render(); }
  else if (a === 'fday') { readForm(); const d = S.form.days, i = +b.dataset.i; d.includes(i) ? d.splice(d.indexOf(i), 1) : d.push(i); render(); }
  else if (a === 'addtime') { readForm(); const t = $('#f_time').value; if (t && !S.form.times.includes(t)) S.form.times.push(t); S.form.times.sort(); render(); }
  else if (a === 'rmtime') { readForm(); S.form.times = S.form.times.filter(t => t !== b.dataset.t); render(); }
  else if (a === 'save') save();
  else if (a === 'cancel') { S.form = null; render(); }
  else if (a === 'hdays') { S.histDays = +b.dataset.n; await loadHist(); render(); }
  else if (a === 'hmed') { S.histMed = id; await loadHist(); render(); }
  else if (a === 'demo') act(() => api('/demo/load', { method: 'POST' }), 'Demo data loaded.');
  else if (a === 'cleardemo') { if (confirm('Remove demo medicines and their records? Your own data is kept.')) act(() => api('/demo', { method: 'DELETE' }), 'Demo data cleared.'); }
  else if (a === 'csv') {
    const rows = [['date', 'time', 'medicine', 'dosage', 'status', 'recorded_at_utc'], ...(S.hist?.doses || []).map(d => [d.scheduled_at.slice(0, 10), d.scheduled_at.slice(11, 16), d.medicine_name, d.dosage, d.status, d.recorded_at || ''])];
    const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
    const u = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })), l = document.createElement('a');
    l.href = u; l.download = 'medminder-history.csv'; l.click(); URL.revokeObjectURL(u);
  }
  else if (a === 'notif') { await Notification.requestPermission(); render(); }
});

document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; $('#medlist').innerHTML = medCards(); } });
// Statuses change as time passes (upcoming -> due -> missed): refresh quietly every minute.
setInterval(() => { if (!S.form && !S.busy && !document.hidden && S.view !== 'settings' && document.activeElement?.tagName !== 'INPUT') boot(); }, 60000);
// Browser reminder: only while this page is open (see Settings text).
const notified = new Set();
setInterval(async () => {
  if (!('Notification' in window) || Notification.permission !== 'granted' || S.error) return;
  try {
    for (const d of await api('/doses?date=' + S.today)) {
      if (d.status === 'due' && !notified.has(d.id)) { notified.add(d.id); new Notification('Time for ' + d.medicine_name, { body: d.dosage + ' · ' + d.scheduled_at.slice(11, 16) }); }
    }
  } catch {}
}, 30000);
boot();
</script>
